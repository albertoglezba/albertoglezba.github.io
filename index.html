<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#263648">
    <meta name="description" content="A personal contact page. Website coming soon.">
    <title>Personal website | Coming soon</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar" aria-label="Language selection">
        <div class="language-toggle" role="group" aria-label="Choose language">
          <button type="button" class="language-button is-active" data-language="en" aria-pressed="true">EN</button>
          <button type="button" class="language-button" data-language="es" aria-pressed="false">ES</button>
        </div>
      </header>

      <section class="content" aria-labelledby="page-title">
        <p class="eyebrow" data-i18n="eyebrow">Personal website</p>
        <h1 id="page-title" data-i18n="title">Under development</h1>
        <p class="status-message" data-i18n="message">I'm renewing this website, is being prepared and will be available soon.</p>
        <a class="resume-download" href="resume.pdf" download="Gerardo-Alberto-Gonzalez-Bautista-Resume.pdf">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3" />
          </svg>
          <span data-i18n="resumeDownload">Download my résumé (PDF)</span>
        </a>

        <section class="contact" aria-labelledby="contact-heading">
          <h2 id="contact-heading" class="visually-hidden" data-i18n="contactHeading">Contact details</h2>
          <button id="contact-toggle" class="contact-card" type="button" aria-expanded="false" aria-controls="contact-details">
            <img src="contact-card.png" alt="" width="1200" height="420">
            <span class="contact-hint" data-i18n="reveal">Click to reveal as text</span>
          </button>
          <div id="contact-details" class="contact-details" hidden></div>
        </section>
      </section>

      <footer class="footer">
        <small data-i18n="footer">© October 2026</small>
      </footer>
    </main>
  </body>
</html>
